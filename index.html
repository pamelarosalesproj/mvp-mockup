<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototipo navegable de MiEnvio.es para validar los flujos del marketplace de transporte.">
  <title>MiEnvio.es · Prototipo</title>
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <a class="skip-link" href="#app">Ir al contenido</a>
  <aside class="demo-bar" aria-label="Controles del prototipo">
    <div class="demo-inner">
      <div class="demo-label"><span aria-hidden="true">◆</span> Modo prototipo</div>
      <label for="demo-scenario">Vista de prueba</label>
      <select id="demo-scenario">
        <optgroup label="Sin sesión">
          <option value="guest-client">Landing pública · Clientes</option>
          <option value="guest-carrier">Landing pública · Transportistas</option>
        </optgroup>
        <optgroup label="Cuentas activas">
          <option value="client">Solo perfil cliente · Panel</option>
          <option value="carrier-approved">Solo perfil transportista · Aprobado</option>
          <option value="dual-client">Ambos perfiles · Vista cliente</option>
          <option value="dual-carrier">Ambos perfiles · Vista transportista</option>
        </optgroup>
        <optgroup label="Registros y revisiones">
          <option value="client-incomplete">Registro de cliente · Incompleto</option>
          <option value="carrier-incomplete">Alta transportista · Sin enviar</option>
          <option value="carrier-pending">Alta transportista · En revisión</option>
          <option value="carrier-rejected">Alta transportista · Requiere correcciones</option>
        </optgroup>
        <optgroup label="Administración">
          <option value="admin">Administración · Altas y comisiones</option>
        </optgroup>
      </select>
      <button class="demo-reset" id="demo-reset" type="button">Reiniciar datos</button>
    </div>
  </aside>

  <div class="audience-tabs" aria-label="Tipo de visitante">
    <div class="shell audience-inner">
      <button class="audience-tab is-active" data-audience="client" type="button">Para clientes</button>
      <button class="audience-tab" data-audience="carrier" type="button">Para transportistas</button>
    </div>
  </div>

  <header class="site-header" id="site-header">
    <div class="shell header-inner">
      <button class="brand" type="button" data-route="home" aria-label="Ir al inicio">MiEnvio<span>.es</span></button>
      <nav class="main-nav" aria-label="Navegación principal" id="main-nav"></nav>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menú</button>
      <div class="header-actions" id="header-actions">
        <button class="button button-ghost" type="button" data-action="login">Entrar o registrarse</button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <script src="app.js?v=13"></script>
</body>
</html>
